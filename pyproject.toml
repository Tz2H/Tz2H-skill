[project]
name = "tz2h-skill"
version = "0.1.0"
description = "Local Agent Skill project for Tz2H skill distillation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
collectors = [
    "playwright>=1.40.0",
    "slack-sdk>=3.27.0",
]
helpers = [
    "pypinyin>=0.48.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]
all = [
    "pypinyin>=0.48.0",
    "playwright>=1.40.0",
    "slack-sdk>=3.27.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"
